.buy{flex:1 1 440px;min-width:0;display:flex;flex-direction:column;gap:18px}
.brandline{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}

.sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.size{height:56px;border-radius:6px;border:1.5px solid #D4D4D8;background:#fff;cursor:pointer;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#18181B}
.size b{font-size:15px}
.size small{font-size:11px;color:#52525B}
.size:hover{border-color:#71717A}
.size.on{border-color:#D9430F;background:#FFF0E8}
.size.oos b{color:#52525B}
.size .dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}

.sm-ok{background:#ECFDF3;color:#14532D}
.sm-order{background:#FFF7ED;color:#7C2D12}

.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid #D4D4D8;border-radius:8px;padding:14px;cursor:pointer;background:#fff}
.opt.on{border-color:#D9430F;background:#FFF0E8}
.opt input{margin:3px 0 0;width:18px;height:18px;accent-color:#D9430F}
.opt b{display:block;font-size:14px}
.opt span{display:block;font-size:12px;color:#52525B;margin-top:2px;line-height:1.45}
.act{display:flex;gap:10px;flex-wrap:wrap}
.qty{display:flex;align-items:center;border:1.5px solid #D4D4D8;border-radius:6px;height:56px;background:#fff}
.qty button{width:44px;height:52px;border:0;background:none;cursor:pointer;color:#18181B;font-size:20px;font-family:inherit}
.qty output{width:36px;text-align:center;font-weight:600}
.add{flex:1 1 220px;height:56px;border:0;border-radius:6px;background:#D9430F;color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.add:hover{background:#B8380A}
.wishb{width:56px;height:56px;border-radius:6px;border:1.5px solid #D4D4D8;background:#fff;color:#3F3F46;cursor:pointer;display:flex;align-items:center;justify-content:center}
.wishb:hover{color:#D9430F;border-color:#D9430F}
.added{display:flex;gap:10px;align-items:center;background:#111113;color:#fff;border-radius:8px;padding:12px 14px;font-size:14px}
.added a{color:#FF7A45;font-weight:600;margin-left:auto}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tr{display:flex;gap:10px;align-items:center;font-size:13px;color:#3F3F46;line-height:1.35}
.tr .ic{width:36px;height:36px;border-radius:8px;background:#F4F4F5;color:#D9430F;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.tabs{margin-top:44px;background:#fff;border:1px solid #E4E4E7;border-radius:10px;overflow:hidden}
.tabbar{display:flex;flex-wrap:wrap;border-bottom:1px solid #E4E4E7;background:#FAFAFA}
.tabbar button{height:56px;padding:0 22px;border:0;background:none;font:inherit;font-weight:600;font-size:15px;color:#52525B;cursor:pointer;border-bottom:3px solid transparent}
.tabbar button.on{color:#18181B;border-bottom-color:#D9430F;background:#fff}
.tabc{padding:26px 28px;font-size:15px;line-height:1.75;color:#27272A;max-width:900px}
.tabc p{margin:0 0 12px}
.spec{width:100%;border-collapse:collapse;font-size:14px}
.spec th,.spec td{text-align:left;padding:10px 12px;border-bottom:1px solid #F4F4F5;vertical-align:top}
.spec th{width:220px;color:#52525B;font-weight:600}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:48px 0 16px}
.sec-h h2{margin:0;font-size:34px;line-height:1}
.sec-h a{font-size:14px;font-weight:500;text-decoration:none;color:#18181B}
.sec-h a:hover{color:#B8380A}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:#fff;border:1px solid #E4E4E7;border-radius:8px;display:flex;flex-direction:column;overflow:hidden;transition:box-shadow .15s,border-color .15s}
.card:hover{border-color:#D4D4D8;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.c-img{display:block;aspect-ratio:1/1;background:#fff;padding:14px}
.c-img img{width:100%;height:100%;object-fit:contain;display:block}
.c-body{padding:4px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.c-title{font-size:14px;font-weight:600;line-height:1.35;color:#18181B;text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px;text-align:center}
.c-title:hover{color:#B8380A}
.avail{display:flex;flex-direction:column;gap:5px;margin-top:auto}
.avail-l{font-size:12px;font-weight:600;text-align:center}
.bar{height:6px;border-radius:3px;background:#E4E4E7;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.lvl-ok .avail-l{color:#15803D}.lvl-ok .bar i{width:100%;background:#22A04B}
.lvl-low .avail-l{color:#C2410C}.lvl-low .bar i{width:45%;background:#F59E0B}
.lvl-last .avail-l{color:#B8380A}.lvl-last .bar i{width:14%;background:#D9430F}
.price{display:flex;align-items:baseline;justify-content:center;gap:8px;flex-wrap:wrap}
.p-now{font-size:19px;font-weight:700;color:#D9430F}
.p-tax{font-size:11px;color:#52525B;width:100%;text-align:center;margin-top:-6px}
.opt-btn{display:inline-flex;align-items:center;justify-content:center;height:44px;border-radius:4px;background:#111113;color:#fff;font-weight:600;font-size:14px;text-decoration:none}
.opt-btn:hover{background:#3F3F46;color:#fff}
.ph{background:#27272A;color:#FDE68A;border-radius:4px;padding:1px 6px;font-size:.92em;white-space:nowrap}
.footer{background:#000;color:#D4D4D8;font-size:14px;margin-top:56px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:32px;padding-top:48px;padding-bottom:36px}
.footer h3{margin:0 0 14px;color:#fff;font-size:15px}
.footer ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.footer a{color:#D4D4D8;text-decoration:none}.footer a:hover{color:#fff}
.fbot{border-top:1px solid #27272A;padding-top:18px;padding-bottom:22px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font-size:12px;color:#A1A1AA}
@media (max-width:760px){
 .wrap{padding:0 16px}
 .hbtns{width:100%}.hbtns .hbtn{flex:1;justify-content:center}
 .logo-k{font-size:30px}
 .gal{flex-direction:column-reverse}
 .thumbs{flex-direction:row;flex:0 0 auto;overflow-x:auto}
 .thumb{width:72px;height:72px;flex:0 0 auto}
 .stage{padding:16px}
 .pnow{font-size:30px}
 .tabc{padding:20px 18px}
 .spec th{width:120px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
}
</style>
<script src="assets/runtime.js" defer></script>

<script type="text/x-dc" data-props='{"$preview":{"width":1440,"height":2700}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { img: 0, size: 0, del: 'ship', qty: 1, tab: 'desc', cartCount: 0, cartTotal: 0, justAdded: false };
  }
  fmt(n) {
    const parts = n.toFixed(2).split('.');
    return parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + parts[1] + ' €';
  }
  renderVals() {
    const s = this.state;
    const imgs = ['img/p171258.webp', 'img/g171258_1.webp', 'img/g171258_2.webp', 'img/g171258_3.webp'];
    const sizeData = [
      { code: 'S', cm: '55 cm', stock: 1 },
      { code: 'M', cm: '57 cm', stock: 0 },
      { code: 'L', cm: '58/59 cm', stock: 0 },
      { code: 'L+', cm: '60/61+ cm', stock: 0 },
      { code: 'XL', cm: '62 cm', stock: 0 }
    ];
    const cur = sizeData[s.size];
    const tabsData = [['desc', 'Descrizione'], ['specs', 'Caratteristiche e taglie'], ['ship', 'Spedizione e ritiro']];
    const lvl = (st) => st >= 10 ? ['lvl-ok', 'Disponibile'] : st >= 2 ? ['lvl-low', 'Pochi pezzi'] : ['lvl-last', 'Ultimo pezzo'];
    const related = [
      { title: 'Casco SCHUBERT SP1 HYBRID - FIA 8859-2024, FIA 8878-2024, SNELL SA2025', price: 900, stock: 3, opt: true, img: 'img/p165179.webp' },
      { title: 'CASCO SCHUBERT SK1 HYBRID BIANCO SNELL CMR 2016', price: 625, stock: 3, opt: true, img: 'img/p148833.webp' },
      { title: 'BORSA PORTA CASCO SCHUBERTH', price: 104, stock: 1, img: 'img/p72698.webp' },
      { title: 'BELL HELMET RS7-K PRO HANS WHITE FIA8859-2024/SA2020', price: 690, stock: 5, opt: true, img: 'img/p148476.webp' }
    ].map((p) => {
      const l = lvl(p.stock);
      return { ...p, priceTxt: this.fmt(p.price), fromTxt: p.opt ? 'da · ' : '', lvlClass: l[0], lvlLabel: l[1] };
    });
    return {
      noSubmit: (e) => e.preventDefault(),
      cartCount: s.cartCount,
      cartTotal: this.fmt(s.cartTotal),
      mainImg: imgs[s.img],
      imgN: s.img + 1,
      thumbs: imgs.map((src, i) => ({ src, n: i + 1, cls: i === s.img ? 'thumb on' : 'thumb', pick: () => this.setState({ img: i }) })),
      sizes: sizeData.map((z, i) => ({
        ...z,
        on: i === s.size ? 'true' : 'false',
        cls: 'size' + (i === s.size ? ' on' : '') + (z.stock ? '' : ' oos'),
        dot: z.stock ? '#22A04B' : '#F59E0B',
        pick: () => this.setState({ size: i, justAdded: false })
      })),
      sizeName: cur.code + ' – ' + cur.cm,
      inStock: cur.stock > 0,
      onOrder: cur.stock === 0,
      addLabel: cur.stock > 0 ? 'Aggiungi al carrello' : 'Ordina questa taglia',
      isShip: s.del === 'ship',
      isPick: s.del === 'pick',
      shipCls: s.del === 'ship' ? 'opt on' : 'opt',
      pickCls: s.del === 'pick' ? 'opt on' : 'opt',
      pickShip: () => this.setState({ del: 'ship' }),
      pickStore: () => this.setState({ del: 'pick' }),
      qty: s.qty,
      inc: () => this.setState({ qty: Math.min(s.qty + 1, cur.stock > 0 ? cur.stock : 9) }),
      dec: () => this.setState({ qty: Math.max(1, s.qty - 1) }),
      add: () => this.setState({ cartCount: s.cartCount + s.qty, cartTotal: s.cartTotal + 1650 * s.qty, justAdded: true }),
      justAdded: s.justAdded,
      tabs: tabsData.map((t) => ({ label: t[1], on: t[0] === s.tab ? 'true' : 'false', cls: t[0] === s.tab ? 'on' : '', pick: () => this.setState({ tab: t[0] }) })),
      tabDesc: s.tab === 'desc',
      tabSpecs: s.tab === 'specs',
      tabShip: s.tab === 'ship',
      openSpecs: () => this.setState({ tab: 'specs' }),
      related
    };
  }
}
</script>
