<style>
body{margin:0;background:#F4F4F5;font-family:Poppins,system-ui,sans-serif;color:#18181B}

.logo-img{display:block;height:auto;max-width:100%}

.logo-n{font-size:10px;color:#A1A1AA;margin-top:4px;letter-spacing:.04em}
.search{flex:1 1 320px;display:flex;min-width:0}

.checker{height:44px;background:repeating-conic-gradient(#0B0B0C 0 25%,#FFFFFF 0 50%) 0 0/22px 22px;-webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.55) 45%,transparent 100%);mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.55) 45%,transparent 100%)}
.layout{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;padding-top:8px;padding-bottom:56px}
.side{flex:1 1 260px;max-width:300px;display:flex;flex-direction:column;gap:20px}
.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:40px}
.box{background:#111113;border-radius:8px;overflow:hidden}
.box h2{margin:0;background:#D9430F;color:#fff;font-size:16px;font-weight:700;padding:14px 20px}
.box ul{list-style:none;margin:0;padding:12px 0}
.box li a{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 20px;color:#fff;text-decoration:none;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.01em}
.box li a:hover{background:#27272A;color:#fff}
.box li a span.pl{width:18px;height:18px;border-radius:50%;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 16px}
.sec-h h2{margin:0;font-size:34px;line-height:1}
.sec-h a{font-size:14px;font-weight:500;text-decoration:none;color:#18181B;display:inline-flex;gap:6px;align-items:center}
.sec-h a:hover{color:#B8380A}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:#fff;border:1px solid #E4E4E7;border-radius:8px;display:flex;flex-direction:column;overflow:hidden;transition:box-shadow .15s,border-color .15s}

.c-img{position:relative;display:block;aspect-ratio:1/1;background:#fff;padding:14px}

.c-badge{position:absolute;top:10px;left:10px;display:flex;gap:6px}
.b-off{background:#D9430F;color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px}
.b-new{background:#111113;color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px}
.wish{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;border:1px solid #E4E4E7;background:#fff;color:#3F3F46;display:flex;align-items:center;justify-content:center;cursor:pointer}
.wish:hover{color:#D9430F;border-color:#D9430F}
.c-body{padding:4px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.c-title{font-size:14px;font-weight:600;line-height:1.35;color:#18181B;text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px;text-align:center}
.c-title:hover{color:#B8380A}
.c-code{font-size:12px;color:#52525B;text-align:center;margin-top:-4px}
.avail{display:flex;flex-direction:column;gap:5px;margin-top:auto;padding-top:4px}
.avail-l{font-size:12px;font-weight:600;text-align:center}
.bar{height:6px;border-radius:3px;background:#E4E4E7;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.lvl-ok .avail-l{color:#15803D}.lvl-ok .bar i{width:100%;background:#22A04B}
.lvl-low .avail-l{color:#C2410C}.lvl-low .bar i{width:45%;background:#F59E0B}
.lvl-last .avail-l{color:#B8380A}.lvl-last .bar i{width:14%;background:#D9430F}
.lvl-order .avail-l{color:#52525B}.lvl-order .bar i{width:0}
.price{display:flex;align-items:baseline;justify-content:center;gap:8px;flex-wrap:wrap}
.p-now{font-size:19px;font-weight:700;color:#D9430F}
.p-old{font-size:13px;color:#71717A;text-decoration:line-through}
.p-tax{font-size:11px;color:#52525B;width:100%;text-align:center;margin-top:-6px}
.c-act{display:flex;gap:8px}
.qty{display:flex;align-items:center;border:1px solid #D4D4D8;border-radius:4px;height:44px}
.qty button{width:30px;height:42px;border:0;background:none;cursor:pointer;color:#3F3F46;font-size:16px}
.qty span{width:24px;text-align:center;font-size:14px}
.cart-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;border:0;border-radius:4px;background:#D9430F;color:#fff;font:inherit;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none}
.cart-btn:hover{background:#B8380A;color:#fff}
.opt-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:4px;background:#111113;color:#fff;font-weight:600;font-size:14px;text-decoration:none}
.opt-btn:hover{background:#3F3F46;color:#fff}
.hero{display:flex;flex-wrap:wrap;border-radius:10px;overflow:hidden;background:#0B0B0C;min-height:400px}
.hero-txt{flex:1 1 360px;padding:44px 44px 36px;color:#fff;display:flex;flex-direction:column;gap:16px;justify-content:center;position:relative}
.hero-img{flex:1 1 360px;background:#fff;display:flex;align-items:center;justify-content:center;padding:24px;position:relative}
.hero-img img{width:100%;max-width:420px;aspect-ratio:1/1;object-fit:contain}
.eyebrow{display:inline-flex;align-self:flex-start;gap:8px;align-items:center;background:#D9430F;color:#fff;font-size:12px;font-weight:700;padding:5px 10px;border-radius:4px;text-transform:uppercase;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;border:1px solid #3F3F46;color:#E4E4E7;padding:4px 10px;border-radius:999px}
.dots{display:flex;gap:8px;margin-top:8px}
.dots button{width:28px;height:4px;border:0;border-radius:2px;background:#3F3F46;padding:0;cursor:pointer}
.dots button.on{background:#FF7A45}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.tile{border-radius:10px;padding:22px 22px;display:flex;gap:16px;align-items:center;min-height:120px;text-decoration:none}
.tile .ic{width:56px;height:56px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.tile b{display:block;font-size:22px;line-height:1.05}
.tile small{display:block;font-size:13px;margin-top:4px}
.t-dark{background:#111113;color:#fff}.t-dark .ic{background:#27272A;color:#FF7A45}.t-dark small{color:#D4D4D8}
.t-red{background:#D9430F;color:#fff}.t-red .ic{background:rgba(0,0,0,.18);color:#fff}.t-red small{color:#fff}
.t-light{background:#fff;color:#18181B;border:1px solid #E4E4E7}.t-light .ic{background:#FFF0E8;color:#D9430F}.t-light small{color:#52525B}
a.tile:hover{filter:brightness(1.06)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.cat{background:#fff;border:1px solid #E4E4E7;border-radius:8px;overflow:hidden;text-decoration:none;color:#18181B;display:flex;flex-direction:column}
.cat:hover{border-color:#D9430F;color:#18181B}
.cat-i{aspect-ratio:4/3;padding:10px;display:flex;align-items:center;justify-content:center;background:#fff}
.cat-i img{width:100%;height:100%;object-fit:contain}
.cat-n{background:#111113;color:#fff;font-size:13px;font-weight:600;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;text-transform:uppercase}
.cat:hover .cat-n{background:#D9430F}
.network{border-radius:10px;background:#111113;color:#fff;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between;padding:28px 32px;position:relative;overflow:hidden}
.network::after{content:"";position:absolute;right:-40px;top:0;bottom:0;width:240px;background:repeating-conic-gradient(#1F1F22 0 25%,transparent 0 50%) 0 0/20px 20px;transform:skewX(-14deg);opacity:.9}
.network > *{position:relative;z-index:1}
.stats{display:flex;gap:32px;flex-wrap:wrap}
.stat b{display:block;font-size:40px;line-height:1;color:#fff}
.stat span{font-size:13px;color:#D4D4D8}
.brands{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.brand{background:#fff;border:1px solid #E4E4E7;border-radius:8px;height:72px;display:flex;align-items:center;justify-content:center;padding:12px}
.brand img{max-width:100%;max-height:44px;object-fit:contain;filter:grayscale(1);opacity:.8;transition:filter .15s,opacity .15s}
.brand:hover img{filter:none;opacity:1}
.store{background:#0B0B0C;color:#fff}
.store .wrap{display:flex;flex-wrap:wrap;gap:32px;padding-top:56px;padding-bottom:56px}
.store-l{flex:1 1 380px;display:flex;flex-direction:column;gap:18px}
.store-r{flex:1 1 380px;min-height:280px;border-radius:10px;background:#18181B;border:1px dashed #52525B;display:flex;align-items:center;justify-content:center;color:#A1A1AA;font-size:14px;text-align:center;padding:24px}
.ph{background:#27272A;color:#FDE68A;border-radius:4px;padding:1px 6px;font-size:.92em;white-space:nowrap}
.srow{display:flex;gap:14px;align-items:flex-start}
.srow .ic{width:40px;height:40px;border-radius:8px;background:#27272A;color:#FF7A45;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.srow b{display:block;font-size:14px}.srow span{font-size:14px;color:#D4D4D8}
.btn-out{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 20px;border-radius:6px;border:1px solid #52525B;color:#fff;text-decoration:none;font-weight:600;font-size:14px}
.btn-out:hover{border-color:#fff;color:#fff}
.btn-red{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 22px;border-radius:6px;background:#D9430F;color:#fff;text-decoration:none;font-weight:600;font-size:14px;border:0;cursor:pointer;font-family:inherit}
.btn-red:hover{background:#B8380A;color:#fff}
.footer{background:#000;color:#D4D4D8;font-size:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:32px;padding-top:48px;padding-bottom:36px}
.footer h3{margin:0 0 14px;color:#fff;font-size:15px}
.footer ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.footer a{color:#D4D4D8;text-decoration:none}.footer a:hover{color:#fff}
.fbot{border-top:1px solid #27272A;padding-top:18px;padding-bottom:22px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font-size:12px;color:#A1A1AA}
.rk{border-radius:10px;background:#111113;color:#fff;overflow:hidden;position:relative}
.rk::before{content:"";position:absolute;right:-60px;top:0;width:300px;height:100%;background:repeating-conic-gradient(#1F1F22 0 25%,transparent 0 50%) 0 0/22px 22px;transform:skewX(-14deg);pointer-events:none}
.rk-top{position:relative;display:flex;flex-wrap:wrap;gap:28px 40px;align-items:center;justify-content:space-between;padding:36px 36px 28px}
.rk-txt{flex:1 1 380px;max-width:560px;display:flex;flex-direction:column;gap:14px}
.rk-serv{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid #27272A}
.rk-s{display:flex;align-items:center;gap:10px;padding:16px 18px;color:#fff;text-decoration:none;font-size:13px;font-weight:600;border-right:1px solid #27272A;background:#0B0B0C}
.rk-s svg{color:#FF7A45;flex:0 0 auto}
.rk-s:hover{background:#D9430F;color:#fff}.rk-s:hover svg{color:#fff}
.ks-pill{display:inline-flex;align-items:center;gap:8px;border:1px solid #3F3F46;border-radius:999px;padding:6px 12px;font-size:12px;color:#E4E4E7}
@media (max-width:760px){
 .wrap{padding:0 16px}
 .side{order:2;max-width:none}

 .hbtns{width:100%}.hbtns .hbtn{flex:1;justify-content:center}
 .logo-k{font-size:30px}

}
.crumbs{display:flex;gap:8px;align-items:center;font-size:13px;color:#52525B;padding-top:14px}
.crumbs a{color:#52525B;text-decoration:none}.crumbs a:hover{color:#B8380A}

.bh-mark img{position:relative;width:100%;max-width:335px;height:auto}
.bh-stats{position:relative;display:flex;gap:26px;flex-wrap:wrap;justify-content:center}

.two{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.two-l{flex:1 1 380px}
.lead{margin:0 0 14px;font-size:17px;line-height:1.65;color:#18181B;font-weight:500}
.body{margin:0;font-size:15px;line-height:1.7;color:#3F3F46}
.tl{flex:1 1 300px;list-style:none;margin:0;padding:0;background:#fff;border:1px solid #E4E4E7;border-radius:10px;overflow:hidden}

.tl li:last-child{border-bottom:0}

.tl span{font-size:13px;color:#52525B;line-height:1.5}
.tl strong{display:block;font-size:14px;color:#18181B;margin-bottom:2px}
.svc{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.sv{background:#fff;border:1px solid #E4E4E7;border-radius:8px;padding:20px 20px 20px 24px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;transition:border-color .15s}
.sv:hover{border-color:#D9430F}
.sv::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#D9430F}
.sv-n{font-size:30px;line-height:1;color:#D4D4D8}
.sv h3{margin:0;font-size:16px;line-height:1.3}
.sv p{margin:0;font-size:13px;line-height:1.55;color:#52525B}
.team{display:flex;flex-wrap:wrap;gap:28px;align-items:center;justify-content:space-between;border-radius:10px;background:#111113;color:#fff;padding:36px;position:relative;overflow:hidden}
.team::after{content:"";position:absolute;right:-50px;top:0;bottom:0;width:260px;background:repeating-conic-gradient(#1F1F22 0 25%,transparent 0 50%) 0 0/22px 22px;transform:skewX(-14deg)}
.team-txt{flex:1 1 380px;max-width:560px;display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
.plate{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;margin:0 auto}
.plate svg{max-width:100%;height:auto;transform:rotate(-6deg)}

@media (max-width:760px){
 .bh-txt{padding:28px 22px}
 .bh-txt h1{font-size:44px !important}
 .team{padding:26px 22px}
 .tl b{flex-basis:80px;font-size:19px}
}
</style>
