<style>
body{margin:0;background:#F4F4F5;font-family:Poppins,system-ui,sans-serif;color:#18181B}
a{color:#B8380A}a:hover{color:#8A2A06}
*{box-sizing:border-box}
.wrap{max-width:1320px;margin:0 auto;padding:0 24px}
.disp{font-family:'Barlow Condensed',Poppins,sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
.topbar{background:#000;color:#D4D4D8;font-size:12px}
.topbar .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between;min-height:36px;padding-top:6px;padding-bottom:6px}
.topbar a{color:#fff;text-decoration:none}
.tb-item{display:inline-flex;align-items:center;gap:6px}
.header{background:#0B0B0C;color:#fff}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:16px 28px;padding-top:18px;padding-bottom:18px}
.logo{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:#fff;flex:0 0 auto}
.logo:hover{color:#fff}
.logo-img{display:block;height:auto;max-width:100%}
.logo-word{display:flex;flex-direction:column;line-height:1}
.logo-k{font-size:34px}
.logo-v{font-size:11px;font-weight:600;letter-spacing:.42em;color:#FF7A45;margin-top:3px;padding-left:2px}
.search{flex:1 1 320px;display:flex;min-width:0}
.search label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.search input{flex:1;min-width:0;height:48px;border:0;padding:0 16px;font:inherit;font-size:14px;border-radius:6px 0 0 6px;color:#18181B}
.search button{width:56px;height:48px;border:0;background:#D9430F;color:#fff;border-radius:0 6px 6px 0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hbtns{display:flex;gap:10px;flex:0 0 auto}
.hbtn{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 16px;border-radius:6px;font-weight:600;font-size:14px;text-decoration:none;border:0;cursor:pointer;font-family:inherit}
.hbtn.dark{background:#27272A;color:#fff}.hbtn.dark:hover{background:#3F3F46;color:#fff}
.hbtn.red{background:#D9430F;color:#fff;position:relative}.hbtn.red:hover{background:#B8380A;color:#fff}
.badge-n{position:absolute;top:4px;left:26px;background:#fff;color:#B8380A;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding-bottom:18px}
.nav a{display:flex;align-items:center;justify-content:center;gap:8px;height:40px;border-radius:4px;background:#27272A;color:#fff;text-decoration:none;font-weight:600;font-size:14px}
.nav a:hover,.nav a.cur{background:#D9430F;color:#fff}
.checker{height:10px;background:repeating-linear-gradient(-60deg,#F04E23 0 16px,#FFFFFF 16px 32px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.08);margin-bottom:22px}
.layout{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;padding-top:8px;padding-bottom:56px}
.side{flex:1 1 260px;max-width:300px;display:flex;flex-direction:column;gap:20px}
.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:22px}
.box{background:#fff;border:1px solid #E4E4E7;border-radius:12px;overflow:hidden}
.box h2{margin:0;display:flex;align-items:center;gap:10px;background:none;color:#71717A;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:16px 18px 8px}
.box h2::before{content:"";width:4px;height:14px;border-radius:2px;background:#F04E23;flex:0 0 auto}
.box ul{list-style:none;margin:0;padding:0 8px 10px}
.box li a{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 10px;border-radius:8px;color:#27272A;text-decoration:none;font-size:14px;font-weight:500;text-transform:none;letter-spacing:0;transition:background .12s,color .12s}
.box li a:hover{background:#FFF0E8;color:#B8380A}
.box li a.cur{background:#FFF0E8;color:#B8380A;font-weight:600;box-shadow:inset 3px 0 0 #F04E23}
.box li a span.pl{width:auto;height:auto;border-radius:0;background:none;color:#A1A1AA;display:flex;align-items:center;flex:0 0 auto;transition:transform .12s,color .12s}
.box li a:hover span.pl{color:#B8380A;transform:translateX(2px)}
.box li + li{border-top:1px solid #F4F4F5}
.fbox{border-radius:12px !important}
.fbox{background:#fff;border:1px solid #E4E4E7;border-radius:8px;overflow:hidden}
.fbox h2{margin:0;font-size:16px;font-weight:700;padding:14px 20px;border-bottom:1px solid #E4E4E7;display:flex;justify-content:space-between;align-items:center}
.fgroup{padding:16px 20px;border-bottom:1px solid #F4F4F5;display:flex;flex-direction:column;gap:10px}
.fgroup:last-child{border-bottom:0}
.fgroup h3{margin:0;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#3F3F46}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;min-height:28px}
.chk input{width:18px;height:18px;accent-color:#D9430F;margin:0}
.chk em{font-style:normal;color:#71717A;font-size:12px;margin-left:auto}
.range{display:flex;gap:8px;align-items:center}
.range label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.range input{width:100%;min-width:0;height:40px;border:1px solid #D4D4D8;border-radius:4px;padding:0 10px;font:inherit;font-size:14px}
.crumb{font-size:13px;color:#52525B;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumb a{color:#52525B;text-decoration:none}.crumb a:hover{color:#B8380A}
.cat-head{background:#0B0B0C;color:#fff;border-radius:10px;overflow:hidden;display:flex;flex-wrap:wrap}
.cat-head-t{flex:1 1 380px;padding:28px 32px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.cat-head-i{flex:0 1 260px;background:#fff;display:flex;align-items:center;justify-content:center;padding:16px;min-height:180px}
.cat-head-i img{width:100%;max-width:200px;aspect-ratio:1/1;object-fit:contain}
.subs{display:flex;flex-wrap:wrap;gap:8px}
.sub{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:999px;border:1px solid #3F3F46;color:#fff;text-decoration:none;font-size:13px;font-weight:500}
.sub:hover{border-color:#FF7A45;color:#fff;background:#18181B}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:#fff;border:1px solid #E4E4E7;border-radius:8px;padding:10px 14px}
.toolbar .res{font-size:14px;color:#3F3F46}
.sort{display:flex;align-items:center;gap:8px;font-size:14px}
.sort select{height:40px;border:1px solid #D4D4D8;border-radius:4px;padding:0 10px;font:inherit;font-size:14px;background:#fff;color:#18181B}
.active{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 12px;border-radius:999px;background:#FFF0E8;color:#B8380A;font-size:13px;font-weight:600;border:0;cursor:pointer;font-family:inherit}
.tag span{width:20px;height:20px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:#fff;border:1px solid #E4E4E7;border-radius:8px;display:flex;flex-direction:column;overflow:hidden;transition:box-shadow .15s,border-color .15s;position:relative}
.card:hover{border-color:#D4D4D8;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.c-img{position:relative;display:block;aspect-ratio:1/1;background:#fff;padding:14px}
.c-img img{width:100%;height:100%;object-fit:contain;display:block}
.c-badge{position:absolute;top:10px;left:10px;display:flex;gap:6px}
.b-off{background:#D9430F;color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px}
.wish{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;border:1px solid #E4E4E7;background:#fff;color:#3F3F46;display:flex;align-items:center;justify-content:center;cursor:pointer}
.wish:hover{color:#D9430F;border-color:#D9430F}
.c-body{padding:4px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.c-title{font-size:14px;font-weight:600;line-height:1.35;color:#18181B;text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px;text-align:center}
.c-title:hover{color:#B8380A}
.c-code{font-size:12px;color:#52525B;text-align:center;margin-top:-4px}
.avail{display:flex;flex-direction:column;gap:5px;margin-top:auto;padding-top:4px}
.avail-l{font-size:12px;font-weight:600;text-align:center}
.bar{height:6px;border-radius:3px;background:#E4E4E7;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.lvl-ok .avail-l{color:#15803D}.lvl-ok .bar i{width:100%;background:#22A04B}
.lvl-low .avail-l{color:#C2410C}.lvl-low .bar i{width:45%;background:#F59E0B}
.lvl-last .avail-l{color:#B8380A}.lvl-last .bar i{width:14%;background:#D9430F}
.lvl-order .avail-l{color:#52525B}.lvl-order .bar i{width:0}
.price{display:flex;align-items:baseline;justify-content:center;gap:8px;flex-wrap:wrap}
.p-now{font-size:19px;font-weight:700;color:#D9430F}
.p-old{font-size:13px;color:#71717A;text-decoration:line-through}
.p-tax{font-size:11px;color:#52525B;width:100%;text-align:center;margin-top:-6px}
.c-act{display:flex;gap:8px}
.cart-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;border:0;border-radius:4px;background:#D9430F;color:#fff;font:inherit;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none}
.cart-btn:hover{background:#B8380A;color:#fff}
.opt-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:4px;background:#111113;color:#fff;font-weight:600;font-size:14px;text-decoration:none}
.opt-btn:hover{background:#3F3F46;color:#fff}
.empty{background:#fff;border:1px dashed #D4D4D8;border-radius:8px;padding:40px;text-align:center;color:#52525B}
.pager{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pager a{min-width:44px;height:44px;border-radius:4px;border:1px solid #E4E4E7;background:#fff;display:flex;align-items:center;justify-content:center;color:#18181B;text-decoration:none;font-weight:600;font-size:14px;padding:0 10px}
.pager a:hover{border-color:#D9430F;color:#B8380A}
.pager a.on{background:#D9430F;border-color:#D9430F;color:#fff}
.seo{background:#fff;border:1px solid #E4E4E7;border-radius:8px;padding:22px 24px;font-size:14px;line-height:1.7;color:#3F3F46}
.ph{background:#27272A;color:#FDE68A;border-radius:4px;padding:1px 6px;font-size:.92em;white-space:nowrap}
.footer{background:#000;color:#D4D4D8;font-size:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:32px;padding-top:48px;padding-bottom:36px}
.footer h3{margin:0 0 14px;color:#fff;font-size:15px}
.footer ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.footer a{color:#D4D4D8;text-decoration:none}.footer a:hover{color:#fff}
.fbot{border-top:1px solid #27272A;padding-top:18px;padding-bottom:22px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font-size:12px;color:#A1A1AA}
@media (max-width:760px){
 .wrap{padding:0 16px}
 .side{order:2;max-width:none}
 .hbtns{width:100%}.hbtns .hbtn{flex:1;justify-content:center}
 .logo-k{font-size:30px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .c-body{padding:4px 10px 12px}
 .cat-head-t{padding:22px 20px}
 .cat-head-i{display:none}
}
</style>
<script src="assets/runtime.js" defer></script>
</head>

<header class="header">
<div class="wrap">
<div class="hrow">

<img src="img/racingkart-logo-white.png" alt="Racingkart" class="logo-img" width="268" height="60">
</a>
<form class="search" role="search" onSubmit="{{noSubmit}}">
<label for="q">Cerca un prodotto</label>
<input id="q" type="search" placeholder="Cerca tra oltre 12.000 articoli: codice, modello, brand…">
<button type="submit" aria-label="Cerca"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></button>

<a href="#" class="hbtn red" aria-label="Carrello: {{cartCount}} articoli, {{cartTotal}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11h11l2-8H6.2"></path><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle></svg><span class="badge-n">{{cartCount}}</span>{{cartTotal}}</a>

<a href="chi-siamo.html">Chi siamo</a>
</nav>

<div class="checker" aria-hidden="true"></div>

<div class="wrap" style="width: 100%">
<div class="layout">

<aside class="side" aria-label="Filtri e categorie">
<div class="fbox">
<h2>Filtra selezione<button class="tag" style="background: none; padding: 0; height: auto; color: #B8380A" onClick="{{reset}}">Azzera</button></h2>
<div class="fgroup">
<h3>Disponibilità</h3>
<label class="chk"><input type="checkbox" checked="{{onlyAvail}}" onChange="{{toggleAvail}}">Solo disponibili subito<em>{{nAvail}}</em></label>
</div>
<div class="fgroup">
<h3>Promozioni</h3>
<label class="chk"><input type="checkbox" checked="{{onlySale}}" onChange="{{toggleSale}}">In offerta<em>{{nSale}}</em></label>
</div>
<div class="fgroup">
<h3>Tipologia</h3>
<sc-for list="{{types}}" as="t" hint-placeholder-count="4">
<label class="chk"><input type="checkbox" checked="{{t.on}}" onChange="{{t.toggle}}">{{t.name}}<em>{{t.n}}</em></label>
</sc-for>
</div>
<div class="fgroup">
<h3>Prezzo (IVA esclusa)</h3>
<div class="range"><label for="pmin">Prezzo minimo</label><input id="pmin" type="number" placeholder="Min €"><span aria-hidden="true">–</span><label for="pmax">Prezzo massimo</label><input id="pmax" type="number" placeholder="Max €"></div>
</div>
</div>
<div class="box">
<h2>Caschi</h2>
<ul>
<li><a href="categoria.html" class="cur">Bell Helmet</a></li>

<li><a href="categoria.html">Schuberth</a></li>
</ul>
</div>
</aside>

<main class="main">
<nav class="crumb" aria-label="Percorso"><a href="index.html">Home</a><span aria-hidden="true">›</span><a href="categoria.html">Caschi</a><span aria-hidden="true">›</span><span aria-current="page" style="color: #18181B; font-weight: 600">Caschi e accessori Bell Helmet</span></nav>

<section class="cat-head" aria-labelledby="h-cat">
<div class="cat-head-t">
<h1 id="h-cat" class="disp" style="margin: 0; font-size: 46px; line-height: .95">Caschi e accessori<br><span style="color: #FF7A45">Bell Helmet</span></h1>
<p style="margin: 0; font-size: 14px; color: #D4D4D8">77 prodotti · caschi omologati FIA e Snell, visiere, borse e ricambi originali</p>
<div class="subs">
<a href="categoria.html" class="sub">Casco Bell KC7-EV CMS e accessori</a>
<a href="categoria.html" class="sub">Casco Bell KC7-CMR</a>
<a href="categoria.html" class="sub">Casco Bell RS7-K</a>

</div>
</div>
<div class="cat-head-i"><img src="img/p148476.webp" alt=""></div>
</section>

<div class="toolbar">
<span class="res"><b>{{shown}}</b> prodotti in questa pagina · 77 in totale</span>
<div class="sort"><label for="sort">Ordina per</label>
<select id="sort" onChange="{{setSort}}">
<option value="rel">Rilevanza</option>
<option value="asc">Prezzo crescente</option>
<option value="desc">Prezzo decrescente</option>
<option value="off">Sconto maggiore</option>
</select>
</div>
</div>

<sc-if value="{{hasActive}}" hint-placeholder-val="{{false}}">
<div class="active">

</sc-for>
</div>
</sc-if>

<div class="grid">
<sc-for list="{{items}}" as="p" hint-placeholder-count="12">
<article class="card">
<a href="prodotto.html" class="c-img" aria-label="{{p.title}}">
<img src="{{p.img}}" alt="{{p.title}}">
<sc-if value="{{p.off}}" hint-placeholder-val="{{false}}"><span class="c-badge"><span class="b-off">{{p.off}}</span></span></sc-if>
</a>
<button class="wish" aria-label="Aggiungi alla wishlist"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-9-9.2C1.8 7.6 4 4.5 7.2 4.5c2 0 3.3 1 4.8 2.8 1.5-1.8 2.8-2.8 4.8-2.8 3.2 0 5.4 3.1 4.2 6.3C19 15.6 12 20 12 20z"></path></svg></button>

<a href="prodotto.html" class="c-title">{{p.title}}</a>
<div class="c-code">Cod. {{p.code}}</div>
<div class="avail {{p.lvlClass}}"><span class="avail-l">{{p.lvlLabel}}</span><span class="bar"><i></i></span></div>
<div class="price"><span class="p-now">{{p.priceTxt}}</span><sc-if value="{{p.regTxt}}" hint-placeholder-val="{{false}}"><span class="p-old">{{p.regTxt}}</span></sc-if><span class="p-tax">{{p.fromTxt}}IVA esclusa</span></div>
<div class="c-act">
<sc-if value="{{p.variable}}" hint-placeholder-val="{{false}}"><a href="prodotto.html" class="opt-btn">Scegli taglia</a></sc-if>
<sc-if value="{{p.simple}}" hint-placeholder-val="{{true}}"><button class="cart-btn" onClick="{{p.add}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11h11l2-8H6.2"></path><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle></svg>{{p.btnLabel}}</button></sc-if>
</div>
</div>

<script type="text/x-dc" data-props='{"$preview":{"width":1440,"height":2600}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { onlyAvail: false, onlySale: false, types: [], sort: 'rel', cartCount: 0, cartTotal: 0 };
  }
  fmt(n) {
    const parts = n.toFixed(2).split('.');
    return parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + parts[1] + ' €';
  }
  lvl(stock) {
    if (stock >= 10) return ['lvl-ok', 'Disponibile'];
    if (stock >= 2) return ['lvl-low', 'Pochi pezzi'];
    if (stock === 1) return ['lvl-last', 'Ultimo pezzo'];
    return ['lvl-order', 'Su ordinazione'];
  }
  data() {
    return [
      { title: 'BELL HELMET RS7-K PRO HANS WHITE FIA8859-2024/SA2020 STAMINA ANTRACITE', code: 'RS7-K HANS STAMINA', type: 'Caschi', price: 892.4, reg: 970, stock: 0, opt: true, img: 'img/p148499.webp' },
      { title: 'BELL HELMET RS7-K PRO HANS WHITE FIA8859-2024/SA2020', code: 'RS7-K HANS', type: 'Caschi', price: 690, reg: 750, stock: 5, opt: true, img: 'img/p148476.webp' },
      { title: 'VISIERA GIALLA PER CASCO BELL KC7 CMR', code: '2010093', type: 'Visiere', price: 100, stock: 4, img: 'img/p149984.webp' },
      { title: 'VISIERA BLU SCURO MULTISTRATO PER CASCO BELL KC7 CMR', code: '2010091', type: 'Visiere', price: 160, stock: 1, img: 'img/p149248.webp' },
      { title: 'VISIERA ROSSA SCURA PER CASCO BELL RS7 PRO / RS7-K', code: '2010050', type: 'Visiere', price: 160, stock: 1, img: 'img/p149245.webp' },
      { title: 'VISIERA BLU SCURA PER CASCO BELL RS7 PRO / RS7-K', code: '2010051', type: 'Visiere', price: 160, stock: 1, img: 'img/p148881.webp' },
      { title: 'VISIERA CHIARA PER CASCO BELL RS7 PRO / RS7-K /HP7', code: '2010041', type: 'Visiere', price: 95, stock: 1, img: 'img/p148878.webp' },
      { title: 'CUSTODIA PER 3 CASCHI BELL FOLDING', code: '2120029', type: 'Borse e custodie', price: 119, stock: 2, img: 'img/p148884.webp' },
      { title: 'BORSA DA VIAGGIO BELL TROLLEY – GRANDE', code: '2120025', type: 'Borse e custodie', price: 150, stock: 3, img: 'img/p140799.webp' },
      { title: 'ZAINO BELL HELMET', code: '2120026', type: 'Borse e custodie', price: 80, stock: 2, img: 'img/p140793.webp' },
      { title: 'CAPPELLO CON VISIERA BELL', code: '2130001', type: 'Accessori', price: 30, stock: 1, img: 'img/p149252.webp' },
      { title: 'Detergente per caschi Bell Helmet (99 ml)', code: '2080010', type: 'Accessori', price: 10.9, stock: 11, img: 'img/p166720.webp' }
    ];
  }
  renderVals() {
    const s = this.state;
    const all = this.data();
    let list = all.filter((p) => (!s.onlyAvail || p.stock > 0) && (!s.onlySale || (p.reg && p.reg > p.price)) && (s.types.length === 0 || s.types.indexOf(p.type) >= 0));
    if (s.sort === 'asc') list = list.slice().sort((a, b) => a.price - b.price);
    if (s.sort === 'desc') list = list.slice().sort((a, b) => b.price - a.price);
    if (s.sort === 'off') list = list.slice().sort((a, b) => ((b.reg || b.price) - b.price) / (b.reg || b.price) - ((a.reg || a.price) - a.price) / (a.reg || a.price));
    const items = list.map((p) => {
      const l = this.lvl(p.stock);
      const off = p.reg && p.reg > p.price ? '-' + Math.round((1 - p.price / p.reg) * 100) + '%' : '';
      return {
        ...p, off,
        priceTxt: this.fmt(p.price),
        regTxt: off ? this.fmt(p.reg) : '',
        fromTxt: p.opt ? 'da · ' : '',
        lvlClass: l[0], lvlLabel: l[1],
        variable: !!p.opt, simple: !p.opt,
        btnLabel: p.stock > 0 ? 'Carrello' : 'Ordina',
        add: () => this.setState({ cartCount: this.state.cartCount + 1, cartTotal: this.state.cartTotal + p.price })
      };
    });
    const typeNames = ['Caschi', 'Visiere', 'Borse e custodie', 'Accessori'];
    const toggleType = (t) => {
      const cur = this.state.types;
      this.setState({ types: cur.indexOf(t) >= 0 ? cur.filter((x) => x !== t) : cur.concat([t]) });
    };
    const activeTags = [];
    if (s.onlyAvail) activeTags.push({ label: 'Solo disponibili', remove: () => this.setState({ onlyAvail: false }) });
    if (s.onlySale) activeTags.push({ label: 'In offerta', remove: () => this.setState({ onlySale: false }) });
    s.types.forEach((t) => activeTags.push({ label: t, remove: () => toggleType(t) }));
    return {
      noSubmit: (e) => e.preventDefault(),
      cartCount: s.cartCount,
      cartTotal: this.fmt(s.cartTotal),
      onlyAvail: s.onlyAvail,
      onlySale: s.onlySale,
      toggleAvail: () => this.setState({ onlyAvail: !s.onlyAvail }),
      toggleSale: () => this.setState({ onlySale: !s.onlySale }),
      nAvail: all.filter((p) => p.stock > 0).length,
      nSale: all.filter((p) => p.reg && p.reg > p.price).length,
      types: typeNames.map((t) => ({ name: t, n: all.filter((p) => p.type === t).length, on: s.types.indexOf(t) >= 0, toggle: () => toggleType(t) })),
      setSort: (e) => this.setState({ sort: e.target.value }),
      reset: () => this.setState({ onlyAvail: false, onlySale: false, types: [] }),
      activeTags,
      hasActive: activeTags.length > 0,
      items,
      shown: items.length,
      isEmpty: items.length === 0
    };
  }
}
</script>
